# PostgreSQL de développement.
#
# Le conteneur ne fournit QUE le serveur : aucune migration n'est montée dans
# `/docker-entrypoint-initdb.d`. L'image n'exécute que les `.sql` placés
# directement dans ce dossier, pas ceux d'un sous-dossier, et le nommage
# `schema_migrations` doit rester géré par un seul outil.
#
# Le schéma est donc créé par `npm run setup` (voir INSTALL.md), qui est aussi
# la seule voie pour peupler `helpdeskpro_test`, inexistante ici :
#
#   npm run setup
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdeskpro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Helpdesk2026!
      POSTGRES_DB: helpdeskpro
    ports:
      - '5432:5432'
    volumes:
      - helpdeskpro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d helpdeskpro']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  helpdeskpro_pgdata:
    name: helpdeskpro_pgdata
